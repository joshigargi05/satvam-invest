name: Build Galora Wealth AI Android & iOS Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'ios/**'
      - 'store-assets/**'
      - 'capacitor.config.json'
      - '.github/workflows/build-mobile-apps.yml'

jobs:
  build-android:
    name: Build Galora Wealth AI Android APK & Signed Play Store AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Prepare Release Upload Keystore for Google Play Store
        working-directory: ./android/app
        run: |
          if [ ! -f galora-upload-key.keystore ]; then
            keytool -genkeypair -v \
              -keystore galora-upload-key.keystore \
              -alias galora-upload-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "GaloraWealthAI2026!" \
              -keypass "GaloraWealthAI2026!" \
              -dname "CN=Galora Wealth AI, OU=Mobile Engineering, O=Galora AI, L=San Francisco, ST=CA, C=US"
          fi

      - name: Build Signed Android APK & Signed Play Store Release Bundle (AAB)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Upload Ready-to-Install Android APK (Signed Release + Debug)
        uses: actions/upload-artifact@v4
        with:
          name: Galora-Wealth-AI-Android-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Signed Google Play Store Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Galora-Wealth-AI-PlayStore-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Store Listing Graphics & Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Galora-Wealth-AI-Store-Assets-And-Keystore
          path: |
            store-assets/*
            android/app/galora-upload-key.keystore
          retention-days: 30

  build-ios:
    name: Build Galora Wealth AI iOS App Bundle (macOS Runner)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies & Sync Capacitor iOS
        run: |
          npm install --legacy-peer-deps
          npm run build
          npx cap sync ios

      - name: Build iOS App Bundle via xcodebuild
        working-directory: ./ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA for TestFlight / App Store Signing
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Galora-Wealth-AI-iOS.ipa Payload

      - name: Upload Galora Wealth AI iOS App Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: Galora-Wealth-AI-iOS-App-IPA
          path: Galora-Wealth-AI-iOS.ipa
          retention-days: 30
