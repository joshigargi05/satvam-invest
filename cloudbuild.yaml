# ============================================================================
# VestraAI (satvam-invest) — Google Cloud Build & Cloud Run CI/CD Pipeline
# Connected to GitHub: https://github.com/joshigargi05/satvam-invest
# Deploys the unified Node.js API + React SPA container to Google Cloud Run
# ============================================================================

substitutions:
  _SERVICE_NAME: satvam-invest
  _REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build the multi-stage Docker container image (Frontend + Backend API)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (works out-of-the-box; attach Cloud SQL / env vars in Cloud Run UI or CLI)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production,SERVE_STATIC=true'

images:
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest'
